[package]
name = "fret-and-breath"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
loki-sdk = { version = "0.7.0", features = ["templates"] }
askama = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.loki]
id = "fret-and-breath"
name = "Fret & Breath"
description = "A private practice library for guitar tabs and ocarina fingerings."
health = "/health"
capabilities = ["database"]
assets = ["static/fonts"]

[package.metadata.loki.limits]
memory_mib = 48
request_bytes = 98304

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
